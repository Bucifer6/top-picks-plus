# D16, D87, D115: build and test pull requests (not drafts), pushes to main and v* tags. A version tag (v1.0.0 etc.)
# publishes a GitHub Release with TopPicksPlus.dll attached. Plain branch pushes don't run (CI minutes cost money):
# open a pull request, as a draft while work is in progress, and mark it ready when it should build.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only changes don't build. GitHub never applies path filters to tag pushes, so every v* tag still builds.
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']

# A newer push to the same branch or pull request cancels the run still going for the older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Draft pull requests don't run (D115).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # D57, D87(b): the SDK comes from global.json (8.0.4xx, latest patch). NuGet packages are cached, keyed on the
      # project files and tool manifest (every package version is pinned there; there are no lock files).
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/TopPicksPlus/TopPicksPlus.csproj
            tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj
            .config/dotnet-tools.json

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not a version like v1.2.3"; exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj

      # One build of everything, with the version stamped in. The test step
      # must not rebuild (--no-build), or the DLL is overwritten as 0.0.0.
      - name: Build plugin and tests
        run: dotnet build tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      # Also writes the C65 sample pictures (D87 d) into artwork-samples/.
      - name: Tests and boundary check
        env:
          ARTWORK_SAMPLES_DIR: ${{ github.workspace }}/artwork-samples
        run: dotnet test tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Keep the artwork sample pictures (C65)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: artwork-samples-${{ steps.ver.outputs.version }}
          path: artwork-samples/
          if-no-files-found: error
          retention-days: 30

      - name: Check the plugin ships no SkiaSharp (D15)
        shell: bash
        run: |
          # Any file or folder with "skia" in its name, at any depth (runtimes/*/native too), fails the build.
          skia_files() { find "$1" -iname '*skia*' -print; }
          # Prove the check bites (card 0003, B36): a native library hidden in a runtimes folder, and a managed
          # SkiaSharp.dll next to the plugin, must both be found; a folder with only the plugin must pass.
          canary="$RUNNER_TEMP/skia-canary"
          mkdir -p "$canary/clean" "$canary/native/runtimes/win-x64/native" "$canary/managed"
          touch "$canary/clean/TopPicksPlus.dll" "$canary/native/TopPicksPlus.dll" "$canary/native/runtimes/win-x64/native/libSkiaSharp.dll" "$canary/managed/SkiaSharp.dll"
          [ -z "$(skia_files "$canary/clean")" ] || { echo "No-SkiaSharp check flags a clean folder"; exit 1; }
          [ -n "$(skia_files "$canary/native")" ] || { echo "No-SkiaSharp check missed a native SkiaSharp library"; exit 1; }
          [ -n "$(skia_files "$canary/managed")" ] || { echo "No-SkiaSharp check missed SkiaSharp.dll"; exit 1; }
          out=src/TopPicksPlus/bin/Release/netstandard2.0
          ls -laR "$out"
          found="$(skia_files "$out")"
          if [ -n "$found" ]; then echo "SkiaSharp files found next to TopPicksPlus.dll; D15 says it is never shipped:"; echo "$found"; exit 1; fi

      - name: Check the DLL carries the version
        shell: bash
        run: |
          v='${{ steps.ver.outputs.version }}'
          # Whole-value match: the version, then end or "+commit", not part of a longer number.
          dll=src/TopPicksPlus/bin/Release/netstandard2.0/TopPicksPlus.dll
          # The UTF-16 version resource (ProductVersion) holds the clean value; the UTF-8 copy has a length byte in front.
          { strings -a -el "$dll"; strings -a "$dll"; } | grep -qE "(^|[^0-9.])${v//./\\.}(\\+|$)" \
            || { echo "TopPicksPlus.dll does not carry version ${{ steps.ver.outputs.version }}"; exit 1; }

      - name: Dependency vulnerability audit
        shell: bash
        run: |
          # Policy (D87 b): any known-vulnerable package (direct or pulled in) fails the build, except the named
          # exceptions below, each recorded as a decision (today only D65/D97). The filter is self-tested below.
          dotnet list src/TopPicksPlus/TopPicksPlus.csproj package --vulnerable --include-transitive | tee audit.txt
          dotnet list tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj package --vulnerable --include-transitive | tee -a audit.txt
          # D65 exception (added by chunk 3, D87 c, D97): SkiaSharp 2.88.3 and SkiaSharp.NativeAssets.* 2.88.3 only.
          # The plugin draws with the copy Emby already loads and ships none of it (D15). Any other flagged
          # package, any other SkiaSharp version, or any other advisory against 2.88.3, still fails.
          allowed='^[[:space:]]*>[[:space:]]+SkiaSharp(\.NativeAssets\.[A-Za-z0-9.]+)?[[:space:]]+(\[2\.88\.3\][[:space:]]+)?2\.88\.3[[:space:]].*https://github\.com/advisories/GHSA-j7hp-h8jx-5ppr[[:space:]]*$'
          flagged() { grep -E '^[[:space:]]*>' "$1" | grep -vE "$allowed" || true; }
          # Prove the filter bites (card 0003): another package, SkiaSharp at another version, and another
          # advisory against 2.88.3 must stay flagged; only the named advisory at 2.88.3 is let through.
          adv='https://github.com/advisories'
          printf '   > Some.Package   1.0.0   High   %s/GHSA-j7hp-h8jx-5ppr\n   > SkiaSharp   [2.88.4]   2.88.4   High   %s/GHSA-j7hp-h8jx-5ppr\n   > SkiaSharp   [2.88.3]   2.88.3   High   %s/GHSA-aaaa-bbbb-cccc\n   > SkiaSharp.NativeAssets.Linux   2.88.3   High   %s/GHSA-j7hp-h8jx-5ppr\n   > SkiaSharp   [2.88.3]   2.88.3   High   %s/GHSA-j7hp-h8jx-5ppr\n' "$adv" "$adv" "$adv" "$adv" "$adv" > audit-canary.txt
          [ "$(flagged audit-canary.txt | wc -l)" -eq 3 ] || { echo "Audit exception filter is wrong:"; flagged audit-canary.txt; exit 1; }
          if [ -n "$(flagged audit.txt)" ]; then echo "Vulnerable packages found:"; flagged audit.txt; exit 1; fi

      - name: Keep the DLL for 3 days
        uses: actions/upload-artifact@v4
        with:
          name: TopPicksPlus-${{ steps.ver.outputs.version }}
          path: src/TopPicksPlus/bin/Release/netstandard2.0/TopPicksPlus.dll
          retention-days: 3

  # D43, D66, D87(a), D105: every test on Windows (junction tests run here), then Stryker on Logic and Storage, failing
  # below 80%. Windows minutes count double, so this job only builds, tests and mutates: no DLL, no audit.
  test-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # Stryker's --since needs the base branch's history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/TopPicksPlus/TopPicksPlus.csproj
            tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: |
          dotnet restore tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj
          dotnet tool restore

      - name: Build
        run: dotnet build tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj -c Release --no-restore

      # D43, D71, card 0003: junction tests skip off Windows, so prove here that they ran and passed. The trx log lists each
      # test's outcome; any test whose name ends in "_junction" that was skipped or missing fails the job.
      - name: Tests and boundary check (Windows)
        run: dotnet test tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal" --logger "trx;LogFileName=windows.trx" --results-directory "$RUNNER_TEMP/trx"

      - name: Junction tests ran and passed on Windows (D43)
        run: |
          trx="$RUNNER_TEMP/trx/windows.trx"
          ran=$(grep -oE 'testName="[^"]*_junction[^"]*" [^>]*outcome="Passed"' "$trx" | wc -l)
          notpassed=$(grep -oE 'testName="[^"]*_junction[^"]*" [^>]*outcome="[A-Za-z]+"' "$trx" | grep -v 'outcome="Passed"' || true)
          echo "Junction tests passed on Windows: $ran"
          [ -z "$notpassed" ] || { echo "Junction tests that did not pass:"; echo "$notpassed"; exit 1; }
          [ "$ran" -ge 7 ] || { echo "Expected at least 7 junction tests to run and pass on Windows, found $ran"; exit 1; }

      # D105: pull requests mutate only code changed against the base branch, pushes to main only the merged change;
      # a v* tag mutates everything. Settings (files, filter, the 80% bar) are in tests/TopPicksPlus.Tests/stryker-config.json.
      - name: Mutation testing (Stryker, Logic and Storage, 80% or fail)
        working-directory: tests/TopPicksPlus.Tests
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            pull_request:*) since="--since:origin/$GITHUB_BASE_REF" ;;
            # The merge commit's first parent is main before the merge (HEAD~1 alone isn't a ref Stryker can resolve).
            push:refs/heads/main) since="--since:$(git rev-parse HEAD~1)" ;;
            *) since="" ;;
          esac
          echo "Stryker scope: ${since:-full run}"
          dotnet stryker --config-file stryker-config.json $since --concurrency 4 --output "$GITHUB_WORKSPACE/stryker"

      - name: Keep the Stryker report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report-${{ github.run_number }}
          path: stryker/reports/
          if-no-files-found: warn
          retention-days: 7

  secrets-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-windows, secrets-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag is not on main"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: TopPicksPlus-*
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" TopPicksPlus.dll --repo "$GITHUB_REPOSITORY" --title "Top Picks Plus $GITHUB_REF_NAME" --generate-notes
