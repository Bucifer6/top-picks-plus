# D16: build and test on every branch and pull request; a v* tag on a commit that is on main
# publishes a GitHub Release with the DLL and its SHA-256 checksum.
# Every action is pinned to a full commit ID (version in the comment) so a moved tag can't change the build.
# D31: builds and tests on Windows, locked restore, checksum and DLL upload before any test runs.
# A weekly run repeats the dependency audit so a newly found vulnerability shows up without a code change.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks reads a pull request's commits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # gitleaks scans the commits being pushed (on a pull request, all of its commits)

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  build:
    needs: secrets
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: ver
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            v="${REF_NAME#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3"; exit 1; }
          else
            v="0.0.$RUN"   # CI builds get a distinct, valid assembly version
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Restore (locked when lock files are committed)
        run: |
          locked=""
          if [ -f src/TopPicksPlus/packages.lock.json ] && [ -f tests/TopPicksPlus.Tests/packages.lock.json ]; then
            locked="--locked-mode"
          else
            echo "::warning::Lock files not committed yet; restoring unlocked. Commit the lock-files artifact."
          fi
          dotnet restore src/TopPicksPlus/TopPicksPlus.csproj $locked
          dotnet restore tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj $locked
          if [ -z "$locked" ]; then
            # Printed so they can be copied from the log and committed (artifact downloads are blocked from Claude's workspace).
            for f in src/TopPicksPlus/packages.lock.json tests/TopPicksPlus.Tests/packages.lock.json; do
              echo "=====LOCKFILE-BEGIN $f"; base64 -w0 "$f"; echo; echo "=====LOCKFILE-END $f"
            done
          fi

      - name: Keep the lock files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lock-files
          path: |
            src/TopPicksPlus/packages.lock.json
            tests/TopPicksPlus.Tests/packages.lock.json
          retention-days: 3

      - name: Build plugin
        env:
          V: ${{ steps.ver.outputs.v }}
        run: dotnet build src/TopPicksPlus/TopPicksPlus.csproj -c Release --no-restore -p:Version="$V"

      - name: Checksum
        run: cd src/TopPicksPlus/bin/Release/netstandard2.0 && sha256sum TopPicksPlus.dll > TopPicksPlus.dll.sha256 && cat TopPicksPlus.dll.sha256

      - name: Keep the DLL for 3 days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TopPicksPlus-${{ steps.ver.outputs.v }}
          path: |
            src/TopPicksPlus/bin/Release/netstandard2.0/TopPicksPlus.dll
            src/TopPicksPlus/bin/Release/netstandard2.0/TopPicksPlus.dll.sha256
          retention-days: 3

      - name: Build tests
        env:
          V: ${{ steps.ver.outputs.v }}
        run: dotnet build tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj -c Release --no-restore -p:Version="$V"

      - name: Tests and boundary check
        run: dotnet test tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Dependency vulnerability audit
        run: |
          set -o pipefail
          for p in src/TopPicksPlus/TopPicksPlus.csproj tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj; do
            dotnet list "$p" package --vulnerable --include-transitive --format json > audit.json
            n=$(python -c "import json;d=json.load(open('audit.json'));print(sum(len(f.get('topLevelPackages',[]))+len(f.get('transitivePackages',[])) for pr in d.get('projects',[]) for f in pr.get('frameworks',[])))")
            echo "$p: $n vulnerable package(s)"
            [ "$n" = "0" ] || { cat audit.json; exit 1; }
          done

      - name: Mutation testing on Logic (Stryker)
        working-directory: tests/TopPicksPlus.Tests
        run: |
          dotnet tool restore
          if find ../../src/TopPicksPlus/Logic -name '*.cs' | grep -q .; then dotnet stryker; else echo "No Logic code yet: nothing to mutate"; fi

      - name: Keep the Stryker report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stryker-report
          path: tests/TopPicksPlus.Tests/StrykerOutput/**/reports/*.md
          if-no-files-found: ignore
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Only release what is on main (D19)
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tagged commit is not on main"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: TopPicksPlus-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes='Install: copy TopPicksPlus.dll into programdata\plugins and restart Emby. Rollback: put the previous release DLL back and restart (D17). Check the download against TopPicksPlus.dll.sha256.'
          gh release create "$TAG" dist/TopPicksPlus.dll dist/TopPicksPlus.dll.sha256 --repo "$GITHUB_REPOSITORY" --title "Top Picks Plus $TAG" --notes "$notes"
