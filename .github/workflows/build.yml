# D16: build and test on every branch and pull request; a v* tag publishes a GitHub Release with the DLL.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the history

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "v=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"; fi

      - name: Build plugin
        run: dotnet build src/TopPicksPlus/TopPicksPlus.csproj -c Release -p:Version=${{ steps.ver.outputs.v }}

      - name: Tests and boundary check
        run: dotnet test tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Dependency vulnerability audit
        run: |
          dotnet list src/TopPicksPlus/TopPicksPlus.csproj package --vulnerable --include-transitive | tee audit.txt
          dotnet list tests/TopPicksPlus.Tests/TopPicksPlus.Tests.csproj package --vulnerable --include-transitive | tee -a audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then echo "Vulnerable packages found"; exit 1; fi

      - name: Mutation testing on Logic (Stryker)
        working-directory: tests/TopPicksPlus.Tests
        run: |
          dotnet tool restore
          if ls ../../src/TopPicksPlus/Logic/*.cs >/dev/null 2>&1; then dotnet stryker; else echo "No Logic code yet: nothing to mutate"; fi

      - name: Keep the DLL for 3 days
        uses: actions/upload-artifact@v4
        with:
          name: TopPicksPlus-${{ steps.ver.outputs.v }}
          path: src/TopPicksPlus/bin/Release/netstandard2.0/TopPicksPlus.dll
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes='Install: copy TopPicksPlus.dll into programdata\plugins and restart Emby. Rollback: put the previous release DLL back and restart (D17).'
          gh release create "$GITHUB_REF_NAME" dist/TopPicksPlus.dll --repo "$GITHUB_REPOSITORY" --title "Top Picks Plus $GITHUB_REF_NAME" --notes "$notes"
